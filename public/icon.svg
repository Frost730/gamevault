<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Base (20px inset for perfect anti-aliased round edges) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#borderGlow)" stroke-width="4" />

  <!-- Centered Gamepad Group (scaled 0.84, centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.84) translate(-256, -284)">
    <!-- Gamepad Outer Body -->
    <path d="M352 144H160C106.98 144 64 186.98 64 240c0 43.83 29.35 80.82 69.58 92.54l36.88 73.76C176.71 418.8 190.28 424 204.09 424c16.32 0 31.63-7.79 41.22-21.01L272 368h80c53.02 0 96-42.98 96-96s-42.98-128-96-128z" 
          fill="url(#glow)" fill-opacity="0.16" stroke="url(#glow)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- D-Pad -->
    <path d="M192 232v48M168 256h48" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Action Buttons with subtle glow -->
    <circle cx="332" cy="244" r="14" fill="#a78bfa"/>
    <circle cx="364" cy="276" r="14" fill="#06b6d4"/>
  </g>
</svg>
